<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة أنس الخاصة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

    <!-- شاشة إدخال كلمة السر -->
    <div id="login-screen" class="w-full max-w-md card-glass rounded-3xl p-8 shadow-2xl text-center transform transition-all duration-300">
        <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6 text-indigo-600 text-3xl shadow-inner">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">منطقة محمية</h1>
        <p class="text-gray-500 text-sm mb-6">يرجى إدخال كلمة السر للوصول إلى المحتوى</p>

        <form id="login-form" onsubmit="checkPassword(event)" class="space-y-4">
            <div>
                <input type="password" id="password-input" placeholder="أدخل كلمة السر هنا..." 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-center text-lg transition duration-200">
            </div>
            <p id="error-msg" class="text-red-500 text-sm hidden font-semibold">كلمة السر غير صحيحة، حاول مجدداً!</p>
            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
                دخول <i class="fa-solid fa-arrow-left mr-2"></i>
            </button>
        </form>
    </div>

    <!-- المحتوى الرئيسي (مخفي افتراضياً) -->
    <div id="main-content" class="w-full max-w-lg card-glass rounded-3xl p-6 sm:p-8 shadow-2xl hidden my-8">
        
        <!-- الهيدر -->
        <div class="text-center mb-8 border-b pb-6 border-gray-200">
            <div class="w-20 h-20 bg-gradient-to-tr from-pink-500 to-indigo-500 rounded-full flex items-center justify-center mx-auto mb-3 text-white text-3xl shadow-lg">
                <i class="fa-solid fa-heart"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-800">مرحباً بك ❤️</h2>
            <p class="text-gray-500 text-sm mt-1">جميع الروابط والمعلومات الخاصة بك في مكان واحد</p>
        </div>

        <!-- قائمة الروابط -->
        <div class="space-y-3 mb-8">
            
            <a href="https://yip.su/birth26" target="_blank" class="flex items-center p-3.5 bg-white border border-gray-100 rounded-2xl shadow-sm hover:shadow-md hover:bg-pink-50 transition duration-200 group">
                <div class="w-10 h-10 rounded-xl bg-pink-100 text-pink-600 flex items-center justify-center ml-3 group-hover:scale-110 transition">
                    <i class="fa-solid fa-gift"></i>
                </div>
                <span class="font-bold text-gray-700 group-hover:text-pink-600 transition">هدية عيد ميلاد</span>
                <i class="fa-solid fa-chevron-left mr-auto text-gray-400 group-hover:text-pink-600 group-hover:-translate-x-1 transition"></i>
            </a>

            <a href="https://yi.su/Anas2" target="_blank" class="flex items-center p-3.5 bg-white border border-gray-100 rounded-2xl shadow-sm hover:shadow-md hover:bg-amber-50 transition duration-200 group">
                <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center ml-3 group-hover:scale-110 transition">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <span class="font-bold text-gray-700 group-hover:text-amber-600 transition">البوت الحمار</span>
                <i class="fa-solid fa-chevron-left mr-auto text-gray-400 group-hover:text-amber-600 group-hover:-translate-x-1 transition"></i>
            </a>

            <a href="https://yip.su/9A9H" target="_blank" class="flex items-center p-3.5 bg-white border border-gray-100 rounded-2xl shadow-sm hover:shadow-md hover:bg-blue-50 transition duration-200 group">
                <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center ml-3 group-hover:scale-110 transition">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <span class="font-bold text-gray-700 group-hover:text-blue-600 transition">رابط الشات</span>
                <i class="fa-solid fa-chevron-left mr-auto text-gray-400 group-hover:text-blue-600 group-hover:-translate-x-1 transition"></i>
            </a>

            <a href="https://yip.su/Eid_Gift_1" target="_blank" class="flex items-center p-3.5 bg-white border border-gray-100 rounded-2xl shadow-sm hover:shadow-md hover:bg-emerald-50 transition duration-200 group">
                <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center ml-3 group-hover:scale-110 transition">
                    <i class="fa-solid fa-moon"></i>
                </div>
                <span class="font-bold text-gray-700 group-hover:text-emerald-600 transition">هدية الفطر</span>
                <i class="fa-solid fa-chevron-left mr-auto text-gray-400 group-hover:text-emerald-600 group-hover:-translate-x-1 transition"></i>
            </a>

            <a href="https://yip.su/BEM_67" target="_blank" class="flex items-center p-3.5 bg-white border border-gray-100 rounded-2xl shadow-sm hover:shadow-md hover:bg-purple-50 transition duration-200 group">
                <div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center ml-3 group-hover:scale-110 transition">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span class="font-bold text-gray-700 group-hover:text-purple-600 transition">هدية البيام</span>
                <i class="fa-solid fa-chevron-left mr-auto text-gray-400 group-hover:text-purple-600 group-hover:-translate-x-1 transition"></i>
            </a>

            <!-- زر نسخ الرقم -->
            <button onclick="copyPhone()" class="w-full text-right flex items-center p-3.5 bg-white border border-gray-100 rounded-2xl shadow-sm hover:shadow-md hover:bg-indigo-50 transition duration-200 group relative">
                <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center ml-3 group-hover:scale-110 transition">
                    <i class="fa-solid fa-phone"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-gray-700 group-hover:text-indigo-600 transition">رقم الهاتف</span>
                    <span class="text-xs text-gray-500 font-mono" dir="ltr">+218 93-5129614</span>
                </div>
                <span id="copy-badge" class="mr-auto text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-semibold">اضغط للنسخ</span>
            </button>

        </div>

        <!-- مواقع التواصل الاجتماعي -->
        <div class="pt-4 border-t border-gray-200">
            <h3 class="text-center text-sm font-semibold text-gray-500 mb-4">حسابات التواصل الاجتماعي</h3>
            <div class="flex justify-center space-x-6 space-x-reverse">
                <a href="https://www.facebook.com/profile.php?id=100015959376067" target="_blank" class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center text-xl shadow-lg hover:scale-110 transition duration-200">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/anaskassem2010/" target="_blank" class="w-12 h-12 bg-gradient-to-tr from-yellow-500 via-red-500 to-purple-500 text-white rounded-full flex items-center justify-center text-xl shadow-lg hover:scale-110 transition duration-200">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://www.pinterest.com/anas2001gamer/" target="_blank" class="w-12 h-12 bg-red-600 text-white rounded-full flex items-center justify-center text-xl shadow-lg hover:scale-110 transition duration-200">
                    <i class="fa-brands fa-pinterest-p"></i>
                </a>
            </div>
        </div>

        <!-- الرسالة الختامية -->
        <div class="mt-8 p-4 rounded-2xl bg-pink-100 border border-pink-200 text-center">
            <p class="text-pink-800 font-bold text-sm sm:text-base leading-relaxed">
                بوسة لو انس زعلك 😙 وسامحيه يا حنونتييي
            </p>
        </div>

    </div>

    <script>
        const CORRECT_PASSWORD = "خنساء انس";

        function checkPassword(e) {
            e.preventDefault();
            const input = document.getElementById('password-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const loginScreen = document.getElementById('login-screen');
            const mainContent = document.getElementById('main-content');

            if (input === CORRECT_PASSWORD) {
                loginScreen.classList.add('hidden');
                mainContent.classList.remove('hidden');
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('password-input').classList.add('border-red-500');
            }
        }

        function copyPhone() {
            const phoneNumber = "+218 93-5129614";
            navigator.clipboard.writeText(phoneNumber).then(() => {
                const badge = document.getElementById('copy-badge');
                badge.innerText = "تم النسخ! ✓";
                badge.classList.remove('bg-indigo-100', 'text-indigo-700');
                badge.classList.add('bg-green-100', 'text-green-700');

                setTimeout(() => {
                    badge.innerText = "اضغط للنسخ";
                    badge.classList.remove('bg-green-100', 'text-green-700');
                    badge.classList.add('bg-indigo-100', 'text-indigo-700');
                }, 2000);
            });
        }
    </script>
</body>
</html>
